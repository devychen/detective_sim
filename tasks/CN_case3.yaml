case:
  setting: |
    作为受邀的侦探，你们三名侦探参加了小提琴家林夕与心外科医生苏阳的订婚派对。派对在林氏庄园举行，当晚9点50分左右，会场突然停电。几分钟后供电恢复，管家沈城慌张地宣布林惟仁（林夕的父亲、仁和医院院长）被发现死于书房。现场所有宾客均成为嫌疑人，而案件背后还牵扯到15年前的医疗事故、心脏移植阴谋、以及另一桩未解的顾明和（顾氏医疗器械总裁）谋杀案。

  victim:
    name: 林惟仁
    description: |
      62岁，仁和医院院长，著名心外科专家。性格强势，近期因反对女儿林夕与苏阳的婚事与二人多次争吵。死亡时身着灰色西装，胸口被一刀贯穿（凶器未找到），尸体呈仰卧状倒在书房办公椅旁。书房的保险箱被打开，文件散落一地。
    identifiers: |
      1. 死亡时间推测为停电前后（21:50-22:00）
      2. 尸体左手握有半片撕碎的纸片（疑似遗嘱残页）
      3. 嘴唇发绀，疑似中毒迹象（需毒理报告确认）

  suspects:
    - name: 林夕
      role: 死者女儿，小提琴家
      motive: |
        1. 长期服用不明药物，可能被父亲控制
        2. 近期行为异常（突然抽烟、吃辣、性格变化）
        3. 疑似继承父亲全部财产（根据林阳证词）
      background: |
        24岁，一年半前从美国治疗后失忆，现与苏阳恋爱。常做"被掏心"的噩梦，近期精神状态不稳定。
      appearance: |
        身着黑色露背晚装（苏阳赠送），右手腕有针孔痕迹（疑似注射药物），指甲缝残留红色物质（待检测）。
      key_items: |
        1. 药瓶（无标签，剩余3粒白色药片）
        2. 日记本（记录噩梦内容："我看到了彤彤的脸"）
        3. 书房钥匙（从沈城处获得）

    - name: 苏阳
      role: 死者学生，心外科主任
      motive: |
        1. 曾被林惟仁威胁离开林夕（涉及前女友林彤死亡真相）
        2. 研究"细胞记忆"理论，疑似操控林夕行为
      background: |
        24岁，前女友林彤（沈城之女）死于美国治疗期间，怀疑被林惟仁谋杀。
      appearance: |
        西装左袖口有褐色污渍（咖啡渍？血迹？），右手虎口处有新鲜擦伤。
      key_items: |
        1. 安眠药空瓶（在房间垃圾桶发现）
        2. 手枪（藏在枕头下）
        3. 林彤的病例复印件（标注"配型成功"）

    - name: 沈城
      role: 林氏庄园管家
      motive: |
        1. 妻子秦思琴、女儿林彤均疑因林/顾两家医疗事故死亡
        2. 曾向林阳散布"遗嘱更改"谣言
      background: |
        49岁，真实身份为沈杰，潜伏林家13年复仇。
      appearance: |
        制服口袋有白色粉末（经检测为氰化钾），鞋底沾有书房窗台的花泥。
      key_items: |
        1. 15年前医疗事故调查报告（藏在床板下）
        2. 林彤的遗物盒（内含染血的手术同意书）
        3. 咖啡托盘（残留毒物反应）

    - name: 林阳
      role: 死者养子，心理医生
      motive: |
        1. 欠债400万，误以为被剥夺继承权
        2. 发现催眠中林夕的异常记忆
      background: |
        28岁，近期与顾晴恋爱，诊所经营不善。
      appearance: |
        西装右侧有窗框刮擦痕迹，左手无名指缺失订婚戒指。
      key_items: |
        1. 催眠记录（提到"苏阳是凶手"）
        2. 侦探调查报告（显示林惟仁与苏阳争吵）
        3. 空酒瓶（房间内）

    - name: 顾晴
      role: 顾明和之女，大提琴手
      motive: |
        1. 深恨抢走苏阳的林夕
        2. 父亲顾明和被杀后情绪失控
      background: |
        25岁，近期行为异常（频繁查看尸检报告）。
      appearance: |
        晚礼服腋下有圆柱形凸起（后证实为毒药瓶），佩戴特殊隐形眼镜（增强暗光视力）。
      key_items: |
        1. 干冰包装（配电室发现）
        2. 父亲死亡现场照片（标注"刀伤与林彤手术刀吻合"）
        3. 未使用的毒药（藏在发饰中）

    - name: 顾宇
      role: 顾明和之子，医疗器械公司经理
      motive: |
        1. 匿名资助受害者女儿陈静雯（可能被威胁）
        2. 仍爱慕林夕
      background: |
        24岁，现女友陈静雯怀孕。
      appearance: |
        领带夹是小提琴形状（与林夕配对），西装内袋有血迹反应。
      key_items: |
        1. 转账记录（每月向陈静雯汇款）
        2. 冰桶（内有融化血纱布）
        3. 郑心媚死亡报告（部分缺失）

    - name: 陈静雯
      role: 记者，顾宇女友
      motive: |
        母亲郑心媚死于医疗事故，曾计划复仇
      background: |
        22岁，怀孕两个月，近期放弃复仇计划。
      appearance: |
        孕妇装口袋有针筒（无针头），相机镜头有血迹。
      key_items: |
        1. 偷拍的顾氏机密文件
        2. 叶酸药瓶（混有不明药片）
        3. 书房钥匙（复制品）

  crime_scene:
    time: 21:50-22:00
    location: 林氏庄园二楼书房
    body_state: |
      1. 致命伤为心脏贯穿伤（凶器类似手术刀）
      2. 尸体呈挣扎状，办公椅翻倒
      3. 左手紧握遗嘱碎片（内容："财产由林阳与林夕平分"）
    environment: |
      1. 窗户未锁（窗台有攀爬痕迹）
      2. 咖啡杯打翻（检测出安眠药和氰化物）
      3. 配电室发现干冰挥发装置（定时停电机关）
    suspicious_items: |
      1. 染血的钢琴线（书架后）
      2. 半枚指纹（保险箱外侧）
      3. 女性发丝（缠绕在尸体纽扣上）

  forensic evidence: 
    time_of_death: 21:30-22:00（根据尸僵程度）
    cause_of_death: 心脏刺创合并氰化物中毒
    body_observations: |
      1. 指甲内有皮肤组织（与苏阳DNA匹配）
      2. 后脑有钝器伤（非致命）
    toxicology: |
      血液检出：
      1. 地西泮（安眠药成分）
      2. 氰化钾（致死剂量）
    other_findings: |
      1. 书房地毯提取到辣椒粉末（与林夕饮食习惯关联）
      2. 遗嘱原件被焚毁（仅剩碎片）

  timeline:
    - "17:00: 顾宇、陈静雯抵达庄园"
    - "17:30: 苏阳被目睹进入厨房"
    - "18:00: 沈城送咖啡至书房"
    - "20:00: 林阳翻窗进入书房（监控盲区）"
    - "21:20: 顾晴在配电室设置干冰装置"
    - "21:50: 停电触发，多人离开会场"
    - "22:00: 尸体被发现"

  investigation_starter:
    holmes: |
      你的放大镜注意到：
      1. 苏阳袖口污渍呈现喷溅状（符合持刀姿势）
      2. 书房窗台花泥与沈城鞋底成分一致
    poirot: |
      你的礼仪修养注意到：
      1. 林夕对顾晴的厌恶眼神不符合"失忆"设定
      2. 陈静雯刻意遮挡孕肚的动作异常
    marple: |
      你像发现教堂捐款异常般注意到：
      1. 管家沈城提及"老爷突然来访"时嘴角抽动
      2. 顾晴的隐形眼镜盒缺少左眼镜片（可能已使用）