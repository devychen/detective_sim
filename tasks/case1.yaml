case:
  setting: |
    As invited detectives, you three will investigate the murder of John on the Sunshine Cruise Ship.
    The case involves complex drug dealings, revenge motives, and multiple conspiracies.
    The victim, John, was a famous nightclub owner in London with financial ties to several people on board.
    The crime occurred between the night of June 19 and early morning of June 20, 1903. Preliminary cause of death is cyanide poisoning, with typical symptoms (e.g., facial cyanosis, muscle contortions).
    The passengers harbor secrets; analyze timelines, evidence, and motives to identify the killer.

  victim:
    name: John
    description: |
      45 years old, a prominent London nightclub owner with extensive illegal operations (drugs, gambling, etc.).
      Former drug addict, regularly traded drugs with Charlie on the Sunshine.
      Paranoid but lax with details, relied on Wendy and deceased assistant "Naive."
      Found with contorted posture, facial cyanosis, white foam at the mouth, and cyanotic nails—consistent with cyanide poisoning.
    identifiers: |
      - Carried drugs and a torn transaction ledger.
      - Needle scars on the right ring finger from long-term drug use.

  suspects:
    - name: William
      role: Senior crewman, Charlie's drug trade partner
      motive: |
        1. Revenge for his son Little William (killed by John's men with tainted drugs).
        2. Take over the drug supply chain by eliminating Charlie.
      background: |
        50 years old, one of the oldest crew members. Drawn into drug trade by Charlie due to financial struggles; harbors guilt.
        Son Little William and daughter-in-law Linda live together; family ties are close but drug dealings are hidden.
      appearance: |
        - Traces of white powder on left sleeve (later confirmed as flour).
        - Wet shoe soles (claimed to have tossed an "empty bottle" into the sea).
      key_items: |
        - Small metal box found in room (traces of cyanide inside).
        - Secret letter to John proposing to replace Charlie.

    - name: Wendy
      role: John's assistant, secretly plotting to replace him
      motive: |
        1. Take control of the drug supply chain.
        2. Silence John to cover her betrayal (killed Little William and Naive).
      background: |
        32 years old, outwardly loyal but ambitious. Altered Linda's reports and hid William's involvement. Skilled at forging handwriting.
      appearance: |
        - Minor cut on right index finger (claimed it was from paperwork).
        - Dust from ventilation ducts on skirt hem.
      key_items: |
        - Practice sheets with forged handwriting matching Linda's.
        - Fibers in ventilation ducts matching her clothes.

    - name: Charlie
      role: First mate, John's drug supplier
      motive: |
        1. Revenge for his brother Naive (killed by John).
        2. Prevent John and William from teaming up against him.
      background: |
        48 years old, seasoned sailor. Used his position to facilitate drug trade. Brother Naive was John's former aide.
      appearance: |
        - Cyanide traces in inner pocket.
        - Fresh scrape on right hand (from climbing ventilation ducts).
      key_items: |
        - Burnt cash remnants (drug payments).
        - Unused cyanide powder (hidden in life jacket).

    - name: Linda
      role: Ship doctor, William's daughter-in-law, double agent
      motive: |
        1. Self-preservation (John discovered her double role).
        2. Exploit William's hatred for John to divert suspicion.
      background: |
        28 years old, orphaned and greedy. Spied for both John and Charlie. Marriage to Little William was a cover for surveillance.
      appearance: |
        - Syringe-shaped bulge in coat pocket (later confirmed as vitamins).
        - Wrist marks (claimed to be from medical practice).
      key_items: |
        - Wendy's fingerprints on medicine cabinet key.
        - Diary entry: "John is suspicious, must act first" (authenticated).

  crime_scene:
    time: June 19, 1903, 22:40-23:00
    location: VIP Cabin 3 (John's room)
    body_state: |
      - Lying on bed, limbs in rigid spasm.
      - Facial cyanosis with foamy saliva.
      - Tainted drugs found on nightstand (injection marks).
    environment: |
      - Ventilation duct cover loose, fresh scratches inside.
      - Glass on nightstand had traces of drugs and cyanide.
    suspicious_items: |
      - Torn transaction records (partial text: "William gets 50% profit").
      - Half a female button (matches Wendy's uniform).

  forensic_evidence: 
    time_of_death: Around 22:50, June 19, 1903 (based on rigor mortis and stomach contents).
    cause_of_death: Respiratory failure from cyanide poisoning.
    body_observations: |
      - Blood cyanide levels 3x lethal dose.
      - Fresh needle marks on arm veins (overlapping drug injection sites).
    toxicology: |
      - Cyanide detected in drugs on nightstand ("One-Shot" modified formula).
      - Residuals show drugs and cyanide were ingested separately.
    other_findings: |
      - Three types of clothing fibers in ventilation ducts (matching Wendy, Charlie, Linda).

  timeline:
    - "18:00: Charlie completes drug deal with John."
    - "18:10: Wendy steals Linda's medicine cabinet key."
    - "18:30: Wendy takes cyanide bottle."
    - "19:30: Linda gives poison to William."
    - "19:40: William meets John (no poison used)."
    - "22:20: Wendy enters John's room via ventilation duct."
    - "22:40: Charlie enters via duct."
    - "23:00: Linda attempts to enter duct."
    - "02:00: Charlie tampers with drug evidence."

  investigation_starter:
    holmes: |
      Your magnifying glass notes conflicting scratch directions in the duct, suggesting multiple entries. The body's contortions indicate violent struggle, but the bedsheet is oddly smooth—possibly rearranged.
    poirot: |
      Your etiquette spots Wendy covering her right-hand wound with her left, yet the cyanide bottle's design requires right-hand strength to open—contradicting her claim of "no contact."
    marple: |
      Like spotting irregularities in church donations, you notice Linda's "filial care" is too forced—the poison dose she gave William could kill three, suggesting framing, not protection.