case:
  setting: |
    作为受邀的侦探，你们三名侦探登上了豪华游轮“阳光号”，调查一起发生在船上的谋杀案。
    受害者是伦敦著名酒吧老板Yosef，他在船上进行毒品交易时离奇死亡。船上人员关系复杂，涉及毒品交易、商业间谍、复仇等多重动机。
    时间背景为2222年6月19日，案件发生在Yosef的船舱内。

  victim:
    name: Yosef
    description: |
      Yosef是伦敦著名酒吧的老板，势力庞大，涉足黄赌毒等非法生意。长期与阳光号的Za c k合作进行毒品交易。
      他本人有严重毒瘾，每晚22:30左右，都会在自己房间吸食毒品，Zack、Wendy、Lynn都知道这个信息。
      性格多疑而狠辣，但手段不高。

  suspects:
    - name: Zack
      role: 阳光号大副，Yosef的毒品供应商
      motive: |
        1. 复仇：弟弟Nick被Yosef杀害，和弟弟关系很深，很爱弟弟。
        2. 利益纠纷与自保：长期与Yosef合作毒品交易，担心属下Wilson与Yosef勾结后，可能失去利用价值而被杀害。
      background: |
        从海运学院毕业，多年打拼成为大副。
        有一个弟弟Nick，为Yosef工作。在弟弟的请求下、利用职务之便帮助Yosef走私毒品、手段老练。
        有一个合作的下属Wilson，为了控制Wilson，安排Lynn与Wilson的儿子王小工交往并结婚。
        为了自身地位，对Yosef隐瞒了Wilson存在。但后来弟弟却因为忠诚而告诉了Yosef，也因此弟弟失去了利用价值、被Yosef捅死。
        为了自保，也为了复仇，起了杀心。
      appearance: |
        中年男性，身材魁梧，水手装扮；
        房间换下的衣服上有疑似通风管道的灰尘痕迹，解释说是检查了自己房间的通风管道，在被问有没有进入Yosef房间的通风管道时模棱两可；
        手上残留可疑粉末（疑似是混有“x毒药”的毒品，和Yosef吸食的一致）。
      key_items: |
        1. 大副办公室内张贴的职务分工表，其中显示Zack当天负责上下船检验，有接触Yosef贴身物品的可能。
        2. 交易时装货物的货袋，现在已经空了，证明交易已经完成。
        3. 但办公室内没有交易后收到的钱，只在火炉里有疑似现金被烧毁的一角。
        4. 与Wilson、Lynn合作往来的密信。
        5. 通风管道爬行工具。

    - name: Wilson
      role: 阳光号资深船工，Zack毒品走私的下属
      motive: |
        1. 复仇：儿子王小工因吸毒死亡，怀疑Yosef和Zack合谋杀害。
        2. 救人：儿媳Lynn自称Yosef要杀她。
      background: |
        在船上工作十余年，因Zack的威逼利诱、参与毒品交易，但出于爱护、对儿子儿媳隐瞒了这个生意。
        期间曾经被Wendy的下属接触，问他是否愿意取代Zack，但因为不想深入参与而拒绝了。
        不久前儿子王小工死了，官方死因是吸毒过量。直到儿子死前才知道他也是被Yosef、Zack、自己祸害的瘾君子，无比自责。
        但同时因为儿子死亡时身体的异常扭曲，怀疑其死因。
        有一个儿媳Lynn，被她当作亲父一样对待，没有将自己的怀疑告诉她。
        儿子死后不久，在船上偷听到Yosef对Zack说“那个小子已经帮你解决掉了”。因而怀疑是两人合谋杀掉了自己的儿子。起了杀心。
        计划让两人自相残杀，让Yosef解决Zack，而后你解决Yosef。
        于是通过Nick，与Yosef写了密信，希望取代Zack，承诺只要Zack的一半利润。但要求Yosef解决Zack。
      appearance: |
        老年男性，面容憔悴；衣服陈旧但整洁干净，没有可疑痕迹。情绪抑郁。
      key_items: |
        1. Wendy下属留下的名片。 
        2. 一个小药瓶，写着维生素C，但实际装着有Lynn提供的“x毒药”。和药瓶配套的针筒不翼而飞，疑似被丢入海里。
        3. 与Yosef的密信，里吗提议合作取代Zack）。
        4. 儿子王小工的遗物（照片、吸毒用具）。

    - name: Lynn
      role: 船医，Wilson的儿媳，双重间谍（为Yosef和Zack提供对方的情报）
      motive: |
        1. Yosef威胁其生命安全，可能先下手为强。
        2. 长期被利用，可能因愤怒或自保杀人。
      background: |
        孤儿出身，只爱钱，因为钱能带来安全感。奋力考上了理想的医学院并毕业后，出于轻松和赚钱更多，选择了船医生，因为可以接触有钱人。
        善于伪装，在船上被Yosef选中去监视Zack，获取了不菲的报酬。但之后每次汇报对象是Wendy，而不是Yosef。
        之后又被Zack选中，以金钱为报酬、接近Wilson并监视。由此开始与王小工交往。被王小工求婚后借此找Zack再加了更多钱，与王小工结婚，继续卧底。
        同时为Yosef和Zack收集情报，与王小工结婚并监视Wilson。
        看出了王小工的死不简单，但毫不关心。
        当天去见Yosef，被质疑是否隐瞒了Wilson的存在。怕他杀人灭口而起了杀心。计划是利用Wilson动手。
      appearance: |
        年轻女性，外表知书达理。
        房间换下的衣服上有疑似通风管道的灰尘痕迹；
        衣服兜里有用水稀释过的“x毒药”的残留水渍；
      key_items: |
        1. 上班所在的医疗室的药柜里，有3瓶药不见了，推测都为“x毒药”。也有3个配套的针筒不见了。
        2. 药柜钥匙在身上，但据供词曾经遗失，找到时在药柜上，药柜当时是打开状态，有一瓶“x毒药”遗失。
        3. 衣服上有毒药水渍、但身上没有药瓶和针筒，可推测丢弃到了海里。

    - name: Wendy
      role: Yosef的秘书，地位仅次于Yosef，犯罪集团的“大脑”
      motive: |
        1. 计划取代Yosef自立门户，清除障碍。
        2. 曾杀害王小工和Nick，可能想掩盖罪行。
      background: |
        渴望在社会上混出头，但作为女生很艰难，于是选择了Yosef并成为了他的得力助手。
        发现Yosef手段不高，于是暗中计划架空其权力。已经成功大半，掌控毒品交易时最后一环。
        对Lynn的情报选择性汇报，比如隐瞒了Lynn汇报的“和Zack一起进货的是船上的Wilson”这条信息，改为私下派人与Wilson接触，问他是否愿意供货并取代Zack，但被Wilson拒绝了。
        得知王小工的存在后，诱骗王小工吸食自家贩卖的毒品，又和Yosef说王小工会威胁到毒品运输的安全，诱骗Yosef同意杀了王小工。实际意图是利用王小工的死亡挑拨Yosef和Zack的关系。
        通过参有“x毒药”的毒品杀了王小工。等待Wilson发现真相并向Yosef或者Zack报仇，从而借刀杀人。
        同时，Nick是一个威胁，因为他对Yosef很忠诚。于是杀了他，就此与Yosef宣战。
        案发当日，登船决定利用这个机会杀掉Yosef。
      appearance: |
        中年女性，眼神锐利，衣服低调但透出冷酷的气息；
        房间换下的衣服上有疑似通风管道的灰尘痕迹；
        衣服兜里有用水稀释过的“x毒药”的残留水渍；
        衣服袖子上沾着没有擦干净的、通风管道挡板的污渍。
      key_items: |
        1. 伪造的Lynn笔迹信件。

  crime_scene:
    time: 2222年6月19日22:40至23:00
    location: 阳光号Yosef的船舱
    body_state: |
      尸体扭曲成不自然的姿势，面部表情痛苦，符合“x毒药”的中毒特征。无明显外伤。
      “x毒药”本身微量可以药用，过量则会死亡。
    environment: |
      床头有少量不含“x毒药”的毒品残留；通风管道挡板脱落，管道内有爬行痕迹。房间内有Zack的脚印。
    suspicious_items: |
      1. 通风管道内的灰尘分布异常，显示有多人先后进入的痕迹。
      2. 尸体旁边的床头上的被吸食的毒品中没有“x毒药”，但Yosef吸食的毒品有“x毒药”，怀疑床头残留的含毒药毒品在Yosef死后被替换。

  forensic_evidence: 
    time_of_death: 2222年6月19日22:40至23:00
    cause_of_death: “x毒药”中毒，吸食了含有"x毒药"的毒品
    body_observations: |
      尸体肌肉僵硬且扭曲，瞳孔放大，嘴角有白色泡沫。
    toxicology: |
      血液中检测到高浓度“x毒药”成分，与毒品混合。
    other_findings: |
      通风管道内发现多组指纹和衣物纤维。
      船头残留混合着“x毒药”的毒品粉末，疑似有人在船头试图利用风吹走时残留。
    other_information: |
      "x毒药"发挥作用只能通过直接注射或入口口服。

  timeline:
    - "17:00: Yosef上船，Zack进行随身物品安检，打开了Yosef的藏有毒品的包，疑似将Yosef本身的干净毒品替换为了有“x毒药”的毒品。"
    - "18:00: Zack与Yosef进行日常的毒品交易。期间找借口确认了Yosef包内仍然是自己替换过的有毒毒品。"
    - "18:10: Wendy去医疗室找Lynn要情报，留意到药柜钥匙在药柜上，于是告诉Lynn，Yosef找她，从而调开了她。"
    - "18:20: Zack与Yosef完成交易、离开船舱时，Lynn与Zack在船舱外擦肩而过。"
    - "18:30: Wendy在医疗室附近被目击。"
    - "18:40: 船上工作人员证词，Wendy在此时向他询问过关于通风管道的事"
    - "18:50: Lynn发现钥匙遗失，去医疗室取“x毒药”时发现了钥匙在药柜上，同时有一瓶“x毒药”遗失了"
    - "19:30: Wilson正准备去找Yosef，却遇到Lynn向Wilson称被Yosef追杀，求Wilson救命，并给Wilson提供了一瓶“x毒药”和一个配套针筒。"
    - "19:40: Wilson与Yosef会面谈合作。"
    - "20:20: Wilson返回告知LynnYosef没想要杀她，让她可以放心，但Lynn神色仍然很不安。"
    - "22:40: Wendy通过通风管道刚到达Yosef船舱上方，就正好撞见Yosef死亡过程。Wendy卸掉挡板，探头确认了Yosef死亡。但她还没来得及采取行动，看来是有人先了。于是直接离开了，没有下去进入船舱。"
    - "22:50: Lynn被目击到在通风管道入口附近。Lynn交代进入了通风管道，但听到了有人在通风管道爬行的声音。躲起来等声音消失后才继续爬。"
    - "23:00: Wendy被目击到似乎交给了同伙什么东西，看形状是药瓶和针筒。"
    - "23:20: Lynn通过通风管道到达了Yosef船舱，发现通风管道挡板已经被卸下，房间内的Yosef已死，死状和死于“x毒药”的死状很像。于是直接离开了，没有下去进入船舱。"
    - "02:10: Zack通过通风管道到达了Yosef船舱，发现通风管道挡板已经被卸下，他跳下去查看，确认Yosef已经死亡。"
    - "02:15: Zack被目击在Yosef房间的通风管道出口附近，疑似拿回了他替换的有毒毒品。"
    - "02:20: Zack被目击站在船头，利用风销毁有毒毒品，表情悲伤。"