case:
  setting: |
    作为受邀的侦探，你们三名侦探将调查发生在阳光号游轮上的约翰谋杀案。
    案件涉及复杂的毒品交易、复仇动机和多重阴谋。
    死者约翰是伦敦知名夜总会老板，与船上多名人员有利益纠葛。
    案发时间为1903年6月19日晚至20日凌晨，死因初步判断为氰化物中毒，尸体呈现典型氰化物中毒特征（如面部青紫、肌肉扭曲）。
    船上人员各怀秘密，需通过时间线、证物和动机分析锁定真凶。

  victim:
    name: 约翰
    description: |
      45岁，伦敦知名夜总会老板，势力庞大，涉及黄赌毒等非法生意。
      早年染有毒瘾，定期在阳光号上与查理进行毒品交易。
      性格多疑但懒于管理细节，依赖温迪和已故助手尼克。
      尸体被发现时呈扭曲姿态，面部青紫，嘴角有白色泡沫，指甲发绀，符合氰化物中毒特征。
    identifiers: |
      - 随身携带毒品和交易记录本（内容被撕毁）
      - 右手无名指有长期注射毒品留下的针孔疤痕

  suspects:
    - name: 威廉
      role: 阳光号资深船工，查理的毒品交易搭档
      motive: |
        1. 为儿子小威廉复仇（小威廉被约翰手下用掺毒毒品杀害）
        2. 摆脱查理控制并接管毒品供应链
      background: |
        50岁，船上资历最老的员工之一。因经济压力被查理拉入毒品交易，长期愧疚。
        儿子小威廉和儿媳琳达同住，家庭关系紧密但隐瞒贩毒事实。
      appearance: |
        - 左手袖口有微量白色粉末（后证实为面粉）
        - 鞋底沾有海水渍（自述曾丢弃“空瓶”到海里）
      key_items: |
        - 房间搜出的小金属盒（内壁检测出氰化物残留）
        - 写给约翰的密信（提议合作取代查理）

    - name: 温迪
      role: 约翰的得力助手，实际谋划取代其地位
      motive: |
        1. 掌控毒品供应链以自立门户
        2. 灭口约翰防止其察觉自己的背叛行为（曾杀害小威廉和尼克）
      background: |
        32岁，表面忠诚实则野心勃勃。长期篡改琳达的情报，隐瞒威廉的存在。擅长模仿笔迹。
      appearance: |
        - 右手食指有轻微割伤（自述为文件划伤）
        - 裙摆内侧有通风管道的灰尘痕迹
      key_items: |
        - 房间发现仿造的琳达笔迹练习纸
        - 通风管道内提取的纤维与其衣物一致

    - name: 查理
      role: 阳光号大副，约翰的毒品供应商
      motive: |
        1. 为弟弟尼克复仇（约翰杀害其弟）
        2. 防止约翰与威廉直接合作威胁自身地位
      background: |
        48岁，老练的水手，利用职权掩护毒品交易。弟弟尼克是约翰前心腹。
      appearance: |
        - 制服口袋内层检测出氰化物反应
        - 右手虎口有新鲜擦伤（攀爬通风管道所致）
      key_items: |
        - 焚烧残留的纸币灰烬（交易毒资）
        - 未使用的氰化物粉末（藏于救生衣夹层）

    - name: 琳达
      role: 船医，威廉儿媳，双重间谍
      motive: |
        1. 自保（约翰发现其双重间谍身份）
        2. 利用威廉对约翰的仇恨转移注意力
      background: |
        28岁，孤儿出身，极度贪财。同时为约翰和查理收集情报，与小威廉婚姻实为监视任务。
      appearance: |
        - 白大褂口袋有针管形状凸起（后证实为普通维生素注射器）
        - 手腕处有捆绑痕迹（自称医疗练习所致）
      key_items: |
        - 药柜钥匙上检测到温迪的指纹
        - 日记本记录“约翰已起疑，需先下手”（笔迹鉴定为真）

  crime_scene:
    time: 1903年6月19日22:40-23:00
    location: 阳光号游轮VIP3舱（约翰房间）
    body_state: |
      - 仰卧于床，四肢呈强直性痉挛
      - 面部青紫伴泡沫状唾液
      - 床头柜发现掺毒毒品（针孔注射痕迹）
    environment: |
      - 通风管道挡板脱落，内侧有新鲜刮痕
      - 床头酒杯检测出毒品和氰化物混合残留
    suspicious_items: |
      - 撕碎的交易记录（部分内容显示“威廉可分50%利润”）
      - 地板角落发现半枚女性纽扣（与温迪制服匹配）

  forensic_evidence: 
    time_of_death: 1903年6月19日22:50左右（根据尸僵和胃内容物判断）
    cause_of_death: 氰化物中毒引发呼吸衰竭
    body_observations: |
      - 血液氰化物浓度达致死量3倍
      - 手臂静脉有新鲜针孔（与吸毒注射位置重叠）
    toxicology: |
      - 床头毒品中检出氰化物，成分为“一针就死”改良配方
      - 酒杯残留物显示毒品与氰化物先后摄入
    other_findings: |
      - 通风管道内提取到三种不同衣物纤维（分别匹配温迪、查理、琳达）

  timeline:
    - "18:00: 查理与约翰完成毒品交易"
    - "18:10: 温迪偷取琳达药柜钥匙"
    - "18:30: 温迪盗取氰化物药瓶"
    - "19:30: 琳达将毒药交给威廉"
    - "19:40: 威廉与约翰会面（未用毒）"
    - "22:20: 温迪通过通风管道进入约翰房间"
    - "22:40: 查理通过通风管道进入房间"
    - "23:00: 琳达试图进入通风管道"
    - "02:00: 查理调换毒品证据"

  investigation_starter:
    holmes: |
      你的放大镜注意到通风管道刮痕方向矛盾，暗示多人先后进入。尸体扭曲姿态显示毒发时剧烈挣扎，但床单却异常平整，疑似被重新整理过。
    poirot: |
      你的礼仪修养注意到温迪总用左手掩住右手伤口，而氰化物药瓶的旋钮设计需右手发力才能打开，这似乎与她“未接触毒药”的陈述矛盾。
    marple: |
      你像发现教堂捐款异常般注意到琳达的“孝顺”过于刻意——她给威廉的毒药剂量足以杀死三人，这不像保护，更像栽赃。