case:
  setting: |
    作为受邀的侦探，你们三名侦探需要调查一起发生在H大学校园内的谋杀案。死者是张恶霸，一个在校内臭名昭著的学生，因其家庭背景强大而长期逍遥法外。案件发生在中元节夜晚的校园探险活动中，涉及多名与死者有复杂恩怨的嫌疑人。校园内流传的恐怖传说和灵异事件为案件增添了神秘色彩。

  victim:
    name: 张恶霸
    description: |
      张恶霸是H大学的学生，家庭背景显赫，父亲是财团董事长。他性格暴戾，好色成性，在校内横行霸道，曾多次欺凌同学，甚至导致一名女生自杀。他身材高大，外表帅气，但行为举止粗鲁，常常仗势欺人。
    identifiers: |
      1. 高大帅气的外表，常穿名牌服装。
      2. 身上可能有被推搡或打斗的痕迹。
      3. 死亡时脸上带有诡异的微笑，疑似中毒症状。

  suspects:
    - name: 李小弟
      role: 张恶霸的同校同学，曾受其欺凌。
      motive: |
        李小弟的表哥李大哥曾被张恶霸打断腿，导致其一生被毁。李小弟发誓要报复张恶霸，曾计划怂恿他犯罪或制造意外。
      background: |
        内向但心思缜密，高中时因表哥的事对张恶霸怀恨在心。大学期间接近张恶霸，表面顺从，实则伺机报复。
      appearance: |
        中等身材，穿着普通，身上可能携带迷幻药残留物。
      key_items: |
        1. 一瓶含有强效迷幻药的矿泉水瓶（已使用）。
        2. 黑市购买迷幻药的交易记录。

    - name: 林校花
      role: 张恶霸的未婚妻，被迫与其订婚。
      motive: |
        林校花厌恶张恶霸的暴行和花心，曾试图让张恶霸主动退婚未果，反而遭到殴打。她渴望自由，对张恶霸怀有杀意。
      background: |
        出身富裕家庭但缺乏关爱，性格柔弱但被逼至绝境后变得果断。与赵帅哥有过短暂的情感纠葛。
      appearance: |
        容貌美丽，妆容精致，当晚穿着考究。身上可能携带毒药残留。
      key_items: |
        1. 一盒剧毒药物“死亡微笑”及解药（已销毁）。
        2. 使用毒药的说明和包装残留。

    - name: 王学习
      role: 长期被张恶霸欺凌的同学。
      motive: |
        王学习高中时即被张恶霸霸凌，大学后仍未摆脱其阴影。他曾计划制造意外杀死张恶霸以彻底解脱。
      background: |
        性格胆小懦弱，但内心压抑着强烈的愤怒。学习成绩优异，擅长暗中策划。
      appearance: |
        身材瘦弱，穿着朴素，手上可能有伪造的血迹残留。
      key_items: |
        1. 伪造的血包和强力昏迷药手帕。
        2. 保存的被霸凌记录和医院病历。

    - name: 赵帅哥
      role: 张恶霸的“朋友”，实为复仇者。
      motive: |
        赵帅哥的母亲是张恶霸的继母，长期受其虐待。赵帅哥为替母亲报仇，刻意接近张恶霸并策划谋杀。
      background: |
        家境复杂，父亲为保险金自杀。伪装成富二代接近张恶霸，心思深沉。
      appearance: |
        外表英俊，穿着时尚，身上可能有枯井附近的泥土痕迹。
      key_items: |
        1. 枯井旁的大石头（未使用）。
        2. 门卫室的敲窗工具。

    - name: 郝闺蜜
      role: 林校花的好友，表姐曾被张恶霸迫害致死。
      motive: |
        郝闺蜜的表姐因张恶霸的强奸和威胁而自杀，她考入H大学为表姐报仇。
      background: |
        聪明坚韧，为复仇精心策划，擅长利用人际关系接近目标。
      appearance: |
        妆容精致，衣服上可能有小树林的泥土和树叶痕迹。
      key_items: |
        1. 小树林中设置的假人和陷阱工具。
        2. 深坑的挖掘工具和隐藏痕迹。

  crime_scene:
    time: 中元节午夜前后（11:00 PM - 12:30 AM）
    location: H大学校园内的旧教学楼、小树林、枯井及校长雕像附近。
    body_state: |
      张恶霸的尸体在枯井中被发现，脸上带有诡异的微笑，疑似中毒身亡。尸体无明显外伤，但肺部麻痹导致窒息。
    environment: |
      当晚校园内光线昏暗，旧教学楼因恐怖传说常年封闭，小树林和枯井人迹罕至。中元节的氛围加剧了紧张感。
    suspicious_items: |
      1. 生物室伪造的血迹和水龙头。
      2. 音乐室的贝多芬雕像（被用于制造灵异现象）。
      3. 小树林中的假人和深坑陷阱。

  forensic_evidence: 
    time_of_death: 估计为11:30 PM - 11:45 PM之间。
    cause_of_death: 吸入剧毒药物“死亡微笑”，导致肺部麻痹和窒息。
    body_observations: |
      1. 面部肌肉僵硬，呈现诡异微笑。
      2. 无其他明显外伤或挣扎痕迹。
    toxicology: |
      检测到“死亡微笑”毒素残留，与林校花持有的毒药一致。
    other_findings: |
      1. 枯井附近有拖拽痕迹和脚印。
      2. 小树林的深坑中有假人和绳索残留。

  timeline:
    - "11:00 PM: 六人在学校后门集合，翻墙进入校园。"
    - "11:15 PM: 在旧教学楼4楼生物室制造“血水”事件，众人四散。"
    - "11:20 PM: 李小弟给张恶霸喝下迷幻药水。"
    - "11:25 PM: 张恶霸与郝闺蜜前往小树林，被假人惊吓后逃跑。"
    - "11:30 PM: 林校花在枯井边用毒药杀死张恶霸。"
    - "11:45 PM: 众人陆续到达校长雕像前集合。"
    - "12:00 AM: 门卫的出现引发恐慌，众人逃离现场。"

  # investigation_starter:
  #   holmes: |
  #     你的放大镜注意到枯井附近的脚印与林校花的鞋印吻合，且她的毒药使用说明上有匆忙销毁的痕迹。
  #   poirot: |
  #     你的礼仪修养注意到林校花在案发后的镇定表现与其平时柔弱的性格不符，暗示其可能隐藏了关键行动。
  #   marple: |
  #     你像发现教堂捐款异常般注意到郝闺蜜对小树林陷阱的描述存在漏洞，假人的设置时间与她的行动时间不符。