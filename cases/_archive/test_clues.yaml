Holmes: |
  The crime scene had a bloody kitchen knife, and the victim had three stab wounds on the chest. The coroner confirmed the wounds were inflicted by a left-handed person.
  A torn piece of paper was scattered at the scene, with the words "Financial Report" written on it.
  The room’s window was slightly open, suggesting someone entered from outside.

Poirot: |
  On the day of the crime, the victim had a heated argument with suspect A, occurring roughly between 5:00 PM and 6:00 PM, Suspect C was spot near them at the time.
  The victim had a fight with suspect B the day before the crime.
  A witness reported seeing a black car parked near the crime scene during that time.

Marple: |
  Suspect A, the victim’s business partner, had financial disputes with the deceased and is right-handed.
  Suspect B appears to have an alibi, but the evidence is questionable. Owns a black car, is left-handed, but faints at the sight of blood.
  Suspect C was seen loitering near the crime scene, is a chef, lost a kitchen knife, and is left-handed.
