case:
  setting: |
    案件发生在1910年5月14日晚间的英国伦敦外的贫困村庄。
    村庄与外界隔绝，村民普遍贫困且心智未开化，仅威廉能说普通话。
    查理是一位表面慈善家，实际压榨贫困劳动力的商人，计划于5月15日离开村庄。
    案发当晚，多名角色因各自动机与查理产生交集，最终查理被发现死于自己的住处。

  victim:
    name: 查理
    description: |
      表面慈善家，实际通过压榨贫困劳动力获利。计划在村庄投资工厂，但被威廉视为威胁。
      案发前与胡克、威廉、雷蒙均有冲突。
      尸体被发现时口吐鲜血，疑似中毒，床板下的地下室入口被打开，地上还有一名昏迷者（吉姆）。
    identifiers: |
      1. 与多名角色存在直接冲突；
      2. 掌握威廉的犯罪证据；
      3. 死前曾与威廉会面。

  suspects:
    - name: 吉姆
      role: 村民，孤儿，仇恨有钱人
      motive: 仇恨有钱人，曾立誓杀光有钱人，但查理并非他所杀。
      background: |
        幼年目睹父亲被有钱人虐待致死，心理扭曲，专杀有钱人并砍下食指和中指。
        案发当晚潜入查理住处，但被击昏在地下室，醒来后发现查理已死。
      appearance: |
        衣衫褴褛，身上携带柴刀（凶器之一），但无血迹；眼神凶狠，行为孤僻。
      key_items: |
        1. 柴刀（未使用）；
        2. 父亲遗留的纸条（内容不明）。

    - name: 雷蒙
      role: 调查伦敦杀人狂案件的警察
      motive: 为女友复仇（女友被查理侵犯后自杀）。
      background: |
        长期潜伏村庄调查杀人狂案件，案发当晚持枪前往查理住处复仇，但未击中查理，后离开。
      appearance: |
        身穿便衣，携带配枪（装有消音器），情绪激动，手部有颤抖痕迹。
      key_items: |
        1. 配枪（开过枪，但未击中查理）；
        2. 女友的遗物（心理暗示）。

    - name: 威廉
      role: 村庄的实际控制者
      motive: 查理威胁揭露其利用贫穷控制村民的罪行。
      background: |
        长期通过贫穷和赌博控制村民，私吞慈善款项。案发当晚与查理会面，下毒杀害查理。
      appearance: |
        衣着相对整洁，手上可能有农药残留，神情紧张。
      key_items: |
        1. 农药瓶（烈性毒药）；
        2. 赌场记录（证明其控制村民的罪行）。

    - name: 胡克
      role: 政府调研员
      motive: 保护被查理绑架的儿子。
      background: |
        掌握查理压榨劳动力的录音，被查理威胁。案发当晚试图绑架查理未果。
      appearance: |
        神情焦虑，携带水果刀（未使用），衣服可能有挣扎痕迹。
      key_items: |
        1. 录音笔（查理的犯罪证据）；
        2. 水果刀（未使用）。

  crime_scene:
    time: 1910年5月14日21:00-22:00
    location: 查理的住处（威廉的房子）
    body_state: |
      口吐鲜血，疑似中毒；卧室床板被掀开，地下室入口暴露；地上有昏迷的吉姆。
    environment: |
      屋内烛光熄灭，卧室窗户打开；地上有打斗痕迹，卧室门被踹开。
    suspicious_items: |
      1. 农药杯（残留毒药）；
      2. 木棒（击昏吉姆的工具）；
      3. 地下室的血迹（可能与吉姆有关）。

  forensic_evidence: 
    time_of_death: 约21:30-22:00
    cause_of_death: 中毒（烈性农药）
    body_observations: |
      口吐鲜血，瞳孔放大，皮肤发青。
    toxicology: |
      胃内检出烈性农药成分。
    other_findings: |
      地下室有打斗痕迹，木棒上检出吉姆的DNA。

  timeline:
    - "21:00: 吉姆潜入查理住处，躲藏在外。"
    - "21:10: 雷蒙持枪进入，查理逃跑，雷蒙踹门未果后离开。"
    - "21:15: 吉姆进入卧室，发现地下室并跳入，被击昏。"
    - "21:25: 胡克持刀进入，未找到查理后离开。"
    - "21:30: 威廉进入，与查理会面并下毒。"
    - "21:40: 胡克再次返回，途中遇到吉姆。"
    - "22:00: 吉姆苏醒，发现查理已死。"

  investigation_starter:
    holmes: |
      你的放大镜注意到农药杯上的指纹与威廉吻合，且地下室的血迹与吉姆的伤口一致。
    poirot: |
      你的礼仪修养注意到威廉在描述时间线时的矛盾，以及胡克的焦虑神情。
    marple: |
      你像发现教堂捐款异常般注意到威廉长期控制村民的赌场记录，以及查理与多名角色的冲突。