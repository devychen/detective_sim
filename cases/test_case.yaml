case:
  setting: |
    作为受邀的侦探，您被邀请调查一起发生在阳光号游轮上的谋杀案。游轮上有多名嫌疑人，每个人都有复杂的背景和动机。您的任务是收集信息，分析线索，并找出凶手。

  victim:
    name: 杨老板
    description: 杨老板是A市一家知名酒吧的老板，涉足多种非法生意，包括毒品交易。
    identifiers: 被发现死在自己的船舱中，死状凄惨，扭曲成不似人形的样子。

  suspects:
    - name: 王船工
      role: 阳光号上的船工
      motive: 王船工的儿子王小工因吸毒过量死亡，王船工怀疑是杨老板和张大副所为，想要为儿子报仇。
      background: 王船工在阳光号上工作多年，收入可观，但实际上是通过与张大副合作贩毒获得高额利润。
      appearance: 没有特别值得注意的外貌特征，但身上可能有与毒品交易相关的证据。
      key_items: 一张路人甲给他的卡片，可能与毒品交易有关；一个小盒子，里面装有剧毒药物。

    - name: 玲船医
      role: 阳光号上的船医
      motive: 玲船医可能想要除掉杨老板，以免他对自己构成威胁，或者是为了钱财。
      background: 玲船医是孤儿出身，通过努力学习成为船医，渴望赚钱，但可能涉足非法活动。
      appearance: 美貌，善于接近有钱人，可能有与毒品交易相关的证据。
      key_items: 两瓶“一针就死”药和两个针管；可能与王船工有关的证据。

    - name: 张大副
      role: 阳光号上的大副
      motive: 张大副可能想要除掉杨老板，以免他对自己构成威胁，或者是为了钱财。
      background: 张大副通过多年的努力成为大副，涉足毒品交易，并与杨老板合作。
      appearance: 没有特别值得注意的外貌特征，但可能有与毒品交易相关的证据。
      key_items: 一包下了毒的毒品；可能与王船工有关的证据。

    - name: 雯秘书
      role: 杨老板的秘书
      motive: 雯秘书可能想要除掉杨老板，以便自己接管他的生意。
      background: 雯秘书是杨老板的得力助手，通过努力工作获得了高位，但可能有野心。
      appearance: 没有特别值得注意的外貌特征，但可能有与毒品交易相关的证据。
      key_items: 一瓶“一针就死”药和一个针管；可能与王船工有关的证据。

  crime_scene:
    time: 2222年6月19日晚上
    location: 阳光号游轮，杨老板的船舱
    body_state: |
      杨老板被发现死在自己的船舱中，死状凄惨，扭曲成不似人形的样子。
    environment: |
      船舱内灯光正常，通风口打开，可能有人通过通风口进入。
    suspicious_items: |
      一瓶“一针就死”药和一个针管；可能与王船工有关的证据。

  forensic_evidence: 
    time_of_death: |
      估计死亡时间为晚上10点半左右。
    cause_of_death: |
      初步判断为中毒死亡，可能是被下毒。
    body_observations: |
      尸体呈现出扭曲的姿势，可能是中毒后疼痛导致的。
    toxicology: |
      检测出“一针就死”毒素的存在。
    other_findings: |
      船舱内发现了一包下了毒的毒品，可能是凶手留下的证据。

  timeline:
    - "18:00: 王船工和张大副进行交易"
    - "18:10: 雯秘书找到玲船医，问她有没有最新的情报"
    - "18:20: 玲船医去见杨老板"
    - "18:30: 雯秘书再次来到船医室，拿走了一瓶“一针就死”药和一个针管"
    - "19:30: 王船工的儿媳玲船医敲开王船工的门，求他救她"
    - "19:40: 王船工去找杨老板，谈论玲船医的欠债问题"
    - "20:20: 王船工回来了，告诉玲船医杨老板根本没想杀她"
    - "22:20: 雯秘书准备好毒药，开始行动"
    - "22:40: 雯秘书通过通风口进入杨老板的船舱"
    - "23:00: 雯秘书重新进入通风管道，回到了自己的房间"